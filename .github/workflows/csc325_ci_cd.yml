name: CSC325 CI/CD

# Trigger: every push to main (plus PRs into main, so the ruleset can
# require this check before a feature branch is merged).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"   # Python version from the tutorial

jobs:
  # ---------------------------------------------------------------
  # Stage 1: Setup - check out the code and install Python
  # ---------------------------------------------------------------
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show versions
        run: |
          python --version
          pip --version

  # ---------------------------------------------------------------
  # Stage 2: Dependencies - install packages (needs Setup)
  # ---------------------------------------------------------------
  dependencies:
    name: Dependencies
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify installed packages have no conflicts
        run: pip check

  # ---------------------------------------------------------------
  # Stage 3: Test - run the full suite; any failure fails the run
  # ---------------------------------------------------------------
  test:
    name: Test
    needs: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run test suite
        run: python manage.py test --verbosity 2

  # ---------------------------------------------------------------
  # Stage 4: Deploy - only after Test passes, only on push to main
  # ---------------------------------------------------------------
  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy application
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Deploying commit ${GITHUB_SHA::7} to production..."
          echo "All tests passed - deploying CSC325 Django API."
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy triggered."
          else
            echo "No RENDER_DEPLOY_HOOK_URL secret set - skipping real deploy."
          fi
          echo "Deployment complete!"
