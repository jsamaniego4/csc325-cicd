# Optional real deployment on Render's free tier (extra credit).
# autoDeploy is off so the GitHub Actions Deploy stage is what triggers it.
services:
  - type: web
    name: csc325-cicd
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
